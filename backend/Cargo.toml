[package]
name = "baln-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
default-run = "baln-backend"

[lib]
name = "baln_backend"
path = "src/lib.rs"

[[bin]]
name = "baln-backend"
path = "src/main.rs"

[[bin]]
name = "baln-admin"
path = "src/bin/admin.rs"

[[bin]]
name = "baln-migrate"
path = "src/bin/migrate.rs"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
cookie = "0.18.1"
dotenvy = "0.15.7"
hex = "0.4.3"
http = "1.3.1"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.8.5"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "cors", "request-id", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
url = "2.5.4"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.17.0", features = ["serde", "v7"] }

[dev-dependencies]
anyhow = "1.0.98"
serial_test = "3.2.0"
wiremock = "0.6.4"

[profile.release]
lto = "thin"
strip = "symbols"
