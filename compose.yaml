name: baln

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: baln
      POSTGRES_USER: baln
      POSTGRES_PASSWORD: baln_dev
    ports:
      - "5432:5432"
    volumes:
      - baln-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baln -d baln"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  baln-postgres:
