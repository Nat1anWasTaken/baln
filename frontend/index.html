<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-dark-512.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Baln 個人複式記帳與收支報表" />
    <meta name="theme-color" content="#171717" />
    <title>Baln｜個人帳務</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("theme");
          const dark =
            preference === "dark" ||
            (preference !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          // The system theme remains the safe fallback when storage is blocked.
        }
      })();
    </script>
    <style>
      #startup-screen {
        --startup-background: #fafafa;
        --startup-foreground: #252525;
        --startup-muted: #737373;
        --startup-surface: #f0f0f0;
        --startup-track: #dedede;
        --startup-easing: cubic-bezier(0.32, 0.72, 0, 1);
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 320px;
        padding: 1rem;
        background: var(--startup-background);
        color: var(--startup-foreground);
        font-family:
          "Geist Variable", Geist, ui-sans-serif, system-ui, sans-serif;
        transition:
          opacity 420ms var(--startup-easing),
          visibility 420ms var(--startup-easing);
      }

      .dark #startup-screen {
        --startup-background: #252525;
        --startup-foreground: #fafafa;
        --startup-muted: #a3a3a3;
        --startup-surface: #333;
        --startup-track: #454545;
      }

      #startup-screen[data-leaving="true"] {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .startup-content {
        display: grid;
        width: min(100%, 20rem);
        justify-items: center;
        gap: 1.25rem;
        text-align: center;
        transition: transform 420ms var(--startup-easing);
      }

      #startup-screen[data-leaving="true"] .startup-content {
        transform: translateY(-4px) scale(0.99);
      }

      .startup-mark {
        display: flex;
        width: 3rem;
        height: 3rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.875rem;
        background: var(--startup-foreground);
        color: var(--startup-background);
      }

      .startup-copy {
        display: grid;
        gap: 0.375rem;
      }

      .startup-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      #startup-status {
        min-height: 1.25rem;
        margin: 0;
        color: var(--startup-muted);
        font-size: 0.875rem;
      }

      .startup-progress {
        position: relative;
        width: 100%;
        height: 0.375rem;
        overflow: hidden;
        border-radius: 999px;
        background: var(--startup-track);
      }

      #startup-progress-value {
        position: absolute;
        inset-block: 0;
        left: 0;
        width: var(--startup-progress, 8%);
        overflow: hidden;
        border-radius: inherit;
        background: var(--startup-foreground);
        transition: width 800ms var(--startup-easing);
      }

      #startup-screen[data-finishing="true"] #startup-progress-value {
        transition-duration: 320ms;
      }

      #startup-progress-value::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          color-mix(in srgb, var(--startup-background) 28%, transparent),
          transparent
        );
        content: "";
        transform: translateX(-100%);
        animation: startup-highlight 1800ms var(--startup-easing) infinite;
      }

      #startup-retry {
        min-height: 2.5rem;
        padding: 0 1rem;
        border: 1px solid var(--startup-track);
        border-radius: 0.625rem;
        background: var(--startup-surface);
        color: var(--startup-foreground);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }

      #startup-retry[hidden] {
        display: none;
      }

      @keyframes startup-highlight {
        55%,
        100% {
          transform: translateX(100%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-screen,
        .startup-content,
        #startup-progress-value {
          transition-duration: 1ms;
        }

        #startup-progress-value::after {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-screen" role="status" aria-live="polite">
      <div class="startup-content">
        <div class="startup-mark" aria-hidden="true">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 5v16"></path>
            <path d="M16 13h2"></path>
            <path d="M16 9h2"></path>
            <path
              d="M20.001 19A2 2 0 0 0 22 17V5a2 2 0 0 0-1.999-2L16 3.002A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 1.999 2H8a5 5 0 0 1 4 2 5 5 0 0 1 4-2z"
            ></path>
            <path d="M6 13h2"></path>
            <path d="M6 9h2"></path>
          </svg>
        </div>
        <div class="startup-copy">
          <h1 class="startup-title">Baln</h1>
          <p id="startup-status">正在開啟 Baln</p>
        </div>
        <div
          id="startup-progress"
          class="startup-progress"
          role="progressbar"
          aria-label="Baln 啟動進度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="8"
        >
          <div id="startup-progress-value"></div>
        </div>
        <button
          id="startup-retry"
          type="button"
          hidden
          onclick="window.location.reload()"
        >
          重新嘗試
        </button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const weights = {
          runtime: 14,
          cache: 18,
          route: 18,
          session: 30,
          commit: 8,
          paint: 4,
        };
        const completed = new Set();
        const startedAt = performance.now();
        const screen = document.getElementById("startup-screen");
        const progress = document.getElementById("startup-progress");
        const status = document.getElementById("startup-status");
        const retry = document.getElementById("startup-retry");
        let value = 8;
        let finished = false;
        let failed = false;

        const setValue = (next) => {
          value = Math.max(value, Math.min(100, next));
          screen.style.setProperty("--startup-progress", `${value}%`);
          progress.setAttribute("aria-valuenow", String(value));
        };

        const setStatus = (label) => {
          if (label) status.textContent = label;
        };

        const complete = (task, label) => {
          if (finished || failed || completed.has(task) || !(task in weights))
            return;
          completed.add(task);
          setValue(value + weights[task]);
          setStatus(label);
        };

        const fail = (label) => {
          if (finished) return;
          failed = true;
          clearTimeout(slowTimer);
          setStatus(label || "無法開啟 Baln，請再試一次。");
          retry.hidden = false;
          progress.setAttribute("aria-invalid", "true");
        };

        const finishAfterPaint = () => {
          if (finished || failed) return;
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              screen.dataset.finishing = "true";
              complete("paint", "正在完成啟動");
              finished = true;
              clearTimeout(slowTimer);
              setValue(100);
              const remaining = Math.max(
                0,
                600 - (performance.now() - startedAt),
              );
              setTimeout(
                () => {
                  setTimeout(() => {
                    screen.dataset.leaving = "true";
                    setTimeout(
                      () => screen.remove(),
                      matchMedia("(prefers-reduced-motion: reduce)").matches
                        ? 10
                        : 440,
                    );
                  }, 140);
                  setStatus("準備完成");
                },
                Math.max(340, remaining),
              );
            });
          });
        };

        const slowTimer = setTimeout(() => {
          if (!finished) {
            setStatus("連線速度較慢，仍在恢復你的工作階段");
          }
        }, 5000);

        window.__BALN_STARTUP__ = {
          complete,
          fail,
          finishAfterPaint,
          setStatus,
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
